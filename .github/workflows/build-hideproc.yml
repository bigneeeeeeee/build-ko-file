name: Build hideproc.ko

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: hideproc 5.10.226 (current device)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install build toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang lld make flex bison \
            libssl-dev libelf-dev bc kmod cpio rsync \
            elfutils libdw-dev python3 file \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          echo "PATH check:"
          which clang ld.lld make || true
          echo "LLVM_VERSION: $(clang --version | head -1)"

      - name: Clone kernel (android12-5.10, official GKI 5.10.226 tag)
        run: |
          git clone --depth 1 --branch android12-5.10.226_r00 \
            https://android.googlesource.com/kernel/common kernel-src

      - name: Prepare config (gki_defconfig + release string)
        run: |
          cd kernel-src
          export PATH="/usr/bin:$PATH"
          export CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 mrproper
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 gki_defconfig
          ./scripts/config \
            --enable CONFIG_MODULES \
            --enable CONFIG_MODULE_UNLOAD \
            --enable CONFIG_KPROBES \
            --enable CONFIG_KALLSYMS \
            --enable CONFIG_KALLSYMS_ALL \
            --disable CONFIG_MODULE_SIG \
            --disable CONFIG_MODULE_SIG_FORCE \
            --disable CONFIG_MODULE_SIG_ALL \
            --disable CONFIG_SYSTEM_TRUSTED_KEYS \
            --disable CONFIG_DEBUG_INFO \
            --set-str CONFIG_LOCALVERSION "-android12-9-00051-ga13323220e07-ab12931418"
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig

      - name: Build kernel preps
        run: |
          cd kernel-src
          export CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 -j"$(nproc)" modules_prepare
          mkdir -p ../dummymod
          echo 'obj-m := dummy.o' > ../dummymod/Makefile
          echo '#include <linux/module.h>' > ../dummymod/dummy.c
          echo 'int dummy_var; MODULE_LICENSE("GPL");' >> ../dummymod/dummy.c
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 M=../dummymod modules || true

      - name: Build hideproc.ko
        run: |
          export CC=clang CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KCFLAGS="-w" \
            -C "$PWD/kernel-src" M="$PWD/src" modules

      - name: Check output
        run: |
          ls -la src/hideproc.ko || (echo "BUILD FAILED"; exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: hideproc-5.10-a13323220e07-ab12931418
          path: src/hideproc.ko